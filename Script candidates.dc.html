<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Cedarville+Cursive&family=La+Belle+Aurore&family=Dawning+of+a+New+Day&family=Allura&family=Mrs+Saint+Delafield&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --citrus-cursor: url('art/cursor-citrus.svg') 6 18, auto;
    --pointer-cursor: url('art/cursor-pointer.svg') 4 4, pointer;
  }
  html, body { margin:0; background:#f2ebdd; cursor: var(--citrus-cursor); }
  a { color:#2f4fe8; }
  a:hover { color:#ff4d00; }
  a, button, .clickable { cursor: var(--pointer-cursor) !important; }
</style>
</helmet>

<div style="font-family:'DM Mono', monospace; background:#f2ebdd; padding:56px 6vw 90px; color:#1c1a17;">
  <div style="font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#ff4d00;">The hand on the Save the Date — and six candidates</div>

  <div style="margin-top:34px; width:520px; max-width:100%; overflow:hidden; height:110px; border:1px solid rgba(47,79,232,.25); background:#fff;">
    <img src="art/save-the-date.png" alt="" style="width:1100px; margin-left:-30px; margin-top:-22px;">
  </div>
  <div style="margin-top:10px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#8d8676;">Reference — monoline pen, wide tracking, slight slant, looped tails</div>

  <div style="margin-top:56px; display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:1px; background:rgba(28,26,23,.18);">
    <sc-for list="{{ fonts }}" as="f" hint-placeholder-count="6">
      <div style="background:#f2ebdd; padding:34px 32px 40px;">
        <div style="font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#ff4d00;">{{ f.label }}</div>
        <div style="margin-top:20px; font-family:{{ f.css }}; font-size:{{ f.big }}; line-height:1.05; color:#2f4fe8;">Kyle &amp; Elizabeth</div>
        <div style="margin-top:10px; font-family:{{ f.css }}; font-size:{{ f.small }}; line-height:1.2; color:#2f4fe8; opacity:.9;">The Madrona, Healdsburg, CA</div>
        <div style="margin-top:18px; font-size:12px; line-height:1.7; color:#3a3630; max-width:38ch;">{{ f.note }}</div>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const FONTS = [
  { label: "A · Sacramento", css: "'Sacramento', cursive", big: "62px", small: "30px", note: "Monoline, even weight, gentle slant. Closest to the pen on the card; reads clean at large sizes." },
  { label: "B · Cedarville Cursive", css: "'Cedarville Cursive', cursive", big: "50px", small: "24px", note: "Actual handwriting — irregular, thin, a little scrappy. Most human, least typographic." },
  { label: "C · La Belle Aurore", css: "'La Belle Aurore', cursive", big: "46px", small: "22px", note: "Wide tracking and quirky letterforms, close to the card's spacing. Casual, note-to-a-friend." },
  { label: "D · Dawning of a New Day", css: "'Dawning of a New Day', cursive", big: "50px", small: "24px", note: "Very fine and upright with long tails. Delicate; can go weak on dark grounds." },
  { label: "E · Allura", css: "'Allura', cursive", big: "62px", small: "30px", note: "Elegant with slight stroke contrast and swashes. Prettier and more formal than the card." },
  { label: "F · Mrs Saint Delafield", css: "'Mrs Saint Delafield', cursive", big: "64px", small: "31px", note: "Calligraphic, high contrast. Beautiful but tips toward traditional invitation." }
];

class Component extends DCLogic {
  renderVals() { return { fonts: FONTS }; }
}
</script>
</body>
</html>
